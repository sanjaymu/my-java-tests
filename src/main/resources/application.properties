spring.application.name=demo

# Health check: /actuator/health plus /actuator/health/liveness and /actuator/health/readiness
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Claude via Spring AI. The key comes from the environment (Secret Manager on Cloud Run).
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
spring.ai.anthropic.chat.model=claude-opus-5-5
spring.ai.anthropic.chat.max-tokens=4096

# Only the API key filter authenticates; skip Boot's default in-memory user and its generated password.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# API key clients must send in the X-API-Key header to call /ai/**.
# If unset, every /ai/** request is rejected.
app.security.api-key=${APP_API_KEY:}
