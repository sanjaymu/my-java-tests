spring.application.name=mcp-server
server.port=${PORT:8081}

# MCP server over Streamable HTTP at http://localhost:8081/mcp
spring.ai.mcp.server.name=sample-task-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.protocol=streamable
spring.ai.mcp.server.instructions=A sample to-do list server. Use the task tools to add, list and complete tasks.

# Browser-based MCP hosts allowed to call /mcp (comma-separated). Default: the MCP Apps basic-host.
mcp.cors.allowed-origins=${MCP_CORS_ALLOWED_ORIGINS:http://localhost:8080}
